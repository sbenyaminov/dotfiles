format = """
$directory\
$git_branch\
$git_status\
$fill\
$kubernetes\
$jobs\
$time\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = "nord"
command_timeout = 2000

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
disabled = true

[fill]
symbol = ' '

[kubernetes]
symbol = '☸ '
style = 'cyan bold'
format = '[$symbol$context( \($namespace\))]($style) '
disabled = false

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[time]
disabled = false
style = 'fg:gray'
format = '[$time]($style) '
time_format = '%H:%M:%S'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white='#D8DEE9'

[palettes.onedark]
dark_blue='#61afef'
blue='#56b6c2'
red='#e06c75'
green='#98c379'
purple='#c678dd'
cyan='#56b6c2'
orange='#be5046'
yellow='#e5c07b'
gray='#828997'
white ='#abb2bf'
black='#2c323c'
